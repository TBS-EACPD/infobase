distance_chart_title:
  transform: [handlebars]
  en: Distance from target, {{year}}
  fr: Écart par rapport à la cible, {{year}}

distance_chart_note:
  en: |
    Numeric departmental result indicators only. Non-numeric indicators, indicators whose target type changed between numeric and non-numeric, and indicators without a numeric result are excluded.
  fr: |
    Indicateurs de résultats ministériels numériques seulement. Les indicateurs non numériques, les indicateurs dont le type de cible est passé de numérique à non numérique (ou l'inverse) et les indicateurs sans résultat numérique sont exclus.

distance_chart_counts:
  transform: [handlebars]
  en: "{{included}} of {{total}} departmental result indicators are shown."
  fr: "{{included}} des {{total}} indicateurs de résultats ministériels sont présentés."


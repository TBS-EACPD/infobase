#import "../_fragments.graphql"

query GovWelcomeMatFinance($lang: String!) {
  root(lang: $lang) {
    gov {
      program_spending {
        ...ProgramSpendingFields
      }
      program_fte {
        ...ProgramFteFields
      }
      org_vote_stat_estimates {
        ...OrgVoteStatEstimatesFields
      }
      org_sobjs {
        ...OrgSobjsFields
      }
    }
  }
}

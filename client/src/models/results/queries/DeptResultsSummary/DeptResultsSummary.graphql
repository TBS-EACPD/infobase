query DeptResultsSummary($lang: String!, $orgId: String) {
  root(lang: $lang) {
    org(org_id: $orgId) {
      crsos {
        id
        name
        results {
          id
          doc
          name
          indicators {
            ...IndicatorSummary
          }
        }
        programs {
          name
          results {
            id
            doc
            name
            indicators {
              ...IndicatorSummary
            }
          }
        }
      }
    }
  }
}
